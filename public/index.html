<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- `maximum-scale=1, user-scalable=no` — without these, focusing a
         text field on this Telegram Mini App WebView could trigger the
         browser's own "zoom in on the focused input" behavior, which reads
         as the whole screen suddenly scaling up/down and the layout
         (Continue button included) jumping around as the keyboard opens —
         reported directly against RegistrationFlow's measurement steps.
         This is a real native app substitute, not a document meant to be
         pinch-zoomed, so disabling that entirely is the fix, not something
         to work around per-field.
         `interactive-widget=overlays-content` (Chromium-only — Android
         Telegram's WebView; harmlessly ignored elsewhere) — NOT
         `resizes-content`, an earlier mistake here: `resizes-content`
         means "the keyboard SHRINKS the visible viewport," which is
         exactly the reflow that pushes fixed-position footers (the
         Continue button) up when the keyboard opens. `overlays-content`
         keeps the layout viewport at its full, keyboard-independent size —
         the keyboard just covers whatever's underneath it, matching this
         app's own `position: 'fixed'` footers (see RegistrationFlow's
         `fixedFooter`), which need a viewport size the keyboard can't
         shrink out from under them. -->
    <!-- `viewport-fit=cover` — without it, iOS Safari/WKWebView never
         populates `env(safe-area-inset-*)` at all (every value resolves to
         0), which is what `react-native-safe-area-context`'s
         `useSafeAreaInsets()` reads under the hood on web. Telegram's own
         chrome (contentSafeAreaInset, see useTelegramSafeArea.js) is a
         separate, already-correct source for ITS overlap — this is
         specifically about the device's own notch/home-indicator, the other
         half of the inset math FloatingTabBar's `Math.max(insets.bottom,
         telegramBottomInset, ...)` depends on. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover, interactive-widget=overlays-content"
    />
    <title>MyApp</title>
    <!-- Temporary payment-provider verification codeword, requested during
         bank approval — safe to remove once the kassa is registered (see
         the conversation this was added in for context). Present in the
         raw HTML response regardless of JS execution, unlike anything
         rendered by the RN app into #root below. -->
    <meta name="payment-verification" content="PLAT" />
    <!-- Telegram Mini App bridge — must load before the app bundle so
         window.Telegram.WebApp is available the moment App.js mounts (see
         App.js's own ready()/expand() call and
         useSupabaseAuthSync.js's bootstrap(), which reads
         window.Telegram.WebApp.initData). Harmless no-op when this page is
         opened outside Telegram — window.Telegram just stays undefined and
         every read of it here is optional-chained. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Every RN <TextInput> renders as a real <input>/<textarea> here on
         web, and browsers draw their own default focus ring on those —
         a thick blue box around the whole field, unrelated to (and far
         more obtrusive than) the actual blinking text caret that already
         marks where typing happens. Dropping just the ring, not the
         caret, is what the client actually needs to see "where I'm
         typing" without the box around the entire field. */
      input:focus,
      textarea:focus {
        outline: none;
      }
      /* react-native-web's own generated classes already set box-sizing:
         border-box on every View/Text/etc. it renders — this is only a
         backstop for the handful of literal DOM elements outside that
         (html/body/#root above, the real <input>s TextInput renders as),
         so Yoga's border-box layout math and the browser's never quietly
         disagree on any of them. */
      * {
        box-sizing: border-box;
      }
      /* Chromium (Android's WebView) draws a grey tap-highlight flash on
         any clickable element by default; WKWebView (iOS) doesn't. Every
         RN Pressable/TouchableOpacity renders as a plain clickable <div>
         here, so left alone this reads as "buttons flash on Android, not
         on iOS" on every single tap — one of the most visible sources of
         the two platforms looking different from each other, not fixable
         per-component since it's the browser's own paint, not anything in
         the RN style tree. */
      * {
        -webkit-tap-highlight-color: transparent;
      }
      /* Safari/WKWebView (iOS) and Chromium (Android) apply different
         default chrome to real form controls — rounded corners, inner
         shadows, platform-specific padding — none of which this app's own
         TextInput/button styling accounts for, since RN's style props don't
         cover OS-native appearance. Neutralizing it is what makes a
         TextInput's actual `theme/tokens.js` styling (border, radius,
         padding) the only thing either platform ever shows. */
      input,
      textarea,
      button,
      select {
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
