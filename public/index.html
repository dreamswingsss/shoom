<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>MyApp</title>
    <!-- Telegram Mini App bridge — must load before the app bundle so
         window.Telegram.WebApp is available the moment App.js mounts (see
         App.js's own ready()/expand() call and
         useSupabaseAuthSync.js's bootstrap(), which reads
         window.Telegram.WebApp.initData). Harmless no-op when this page is
         opened outside Telegram — window.Telegram just stays undefined and
         every read of it here is optional-chained. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
