<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- `maximum-scale=1, user-scalable=no` — without these, focusing a
         text field on this Telegram Mini App WebView could trigger the
         browser's own "zoom in on the focused input" behavior, which reads
         as the whole screen suddenly scaling up/down and the layout
         (Continue button included) jumping around as the keyboard opens —
         reported directly against RegistrationFlow's measurement steps.
         This is a real native app substitute, not a document meant to be
         pinch-zoomed, so disabling that entirely is the fix, not something
         to work around per-field. `interactive-widget=resizes-content` is
         the modern (Chromium-only; harmlessly ignored elsewhere) hint that
         an on-screen keyboard should shrink the visual viewport rather than
         overlay it un-announced — keeps position:fixed content (every
         Modal/BottomSheet in this app) working with the keyboard instead of
         guessing. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, interactive-widget=resizes-content"
    />
    <title>MyApp</title>
    <!-- Temporary payment-provider verification codeword, requested during
         bank approval — safe to remove once the kassa is registered (see
         the conversation this was added in for context). Present in the
         raw HTML response regardless of JS execution, unlike anything
         rendered by the RN app into #root below. -->
    <meta name="payment-verification" content="PLAT" />
    <!-- Telegram Mini App bridge — must load before the app bundle so
         window.Telegram.WebApp is available the moment App.js mounts (see
         App.js's own ready()/expand() call and
         useSupabaseAuthSync.js's bootstrap(), which reads
         window.Telegram.WebApp.initData). Harmless no-op when this page is
         opened outside Telegram — window.Telegram just stays undefined and
         every read of it here is optional-chained. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Every RN <TextInput> renders as a real <input>/<textarea> here on
         web, and browsers draw their own default focus ring on those —
         a thick blue box around the whole field, unrelated to (and far
         more obtrusive than) the actual blinking text caret that already
         marks where typing happens. Dropping just the ring, not the
         caret, is what the client actually needs to see "where I'm
         typing" without the box around the entire field. */
      input:focus,
      textarea:focus {
        outline: none;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
